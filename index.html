<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sementes do Futuro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- estilização do mapa (leaflet)-->
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- interação do mapa (leaflet)-->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
</head>

<body>
    <div class="container">
        <section class="conteudo">
            <aside class="side-bar">
                <div class="brand-header">
                    <img src="assets/img-exemplo.png" alt="logo" class="logo">
                    <p class="descricao">Mapa verde de <br> <strong>Vitória da Conquista</strong></p>
                </div>
                <div class="button-list">
                    <button class="btn-filtro"> <img class="icons" src="assets/svg-icon/map.svg" alt="Ícone de filtro geral">Todos os pontos</button>
                    <button class="btn-filtro"> <img class="icons" src="assets/svg-icon/oil-icon-sidebar.svg" alt="ícon de filtro óleo"> Coleta de óleo</button>
                    <button class="btn-filtro"> <img class="icons" src="assets/svg-icon/recycle.svg" alt="Ícone de filtro reciclagem">Reciclagem</button>
                    <button class="btn-filtro"> <img class="icons" src="assets/svg-icon/icon-electronic-sidebar.svg" alt="ícone de filtro eletrônicos"> Eletrônicos</button>
                    <button class="btn-filtro"> <img class="icons" src="assets/svg-icon/plant-icon-sidebar.svg" alt="ícone de filtro hortas"> Hortas comunitárias</button>
                    <button class="btn-filtro"> <img class="icons" src="assets/svg-icon/project-icon-sidebar.svg" alt="ícone de filtro projetos "> Projetos sustentáveis</button>
                    <button class="btn-filtro"><img class="icons "src="assets/svg-icon/tree.svg" alt="ícone de filtro árvores">Arborização</button>
                    <button class="btn-filtro"> <img class="icons" src="assets/svg-icon/seed-icon-sidebar.svg" alt="ícone de filtro sementes"> Banco de sementes</button>
                </div>
            </aside>
            <div class="conteudo-direita">
                <header>
                    <button class="sobre">Sobre o projeto</button>
                </header>
                <main class="main">
                    <div id="map"></div>
                </main>
            </div>
        </section>

        <section class="metricas"></section>

        <footer>
            <img class="icon-footer" src="assets/svg-icon/folha.svg" alt="Ícone de folha">
            <p> Sementes do futuro - Cultivando hoje o futuro da nossa cidade.</p>
            <p class="footer-text">Participe! Plante, cuide e compartilhe.</p>
            <img class="icon-footer" src="assets/svg-icon/plant-icon-footer.svg" alt="">
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
